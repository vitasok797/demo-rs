[package]
name = "demo-rs"
version = "0.1.0"
edition = "2024"

[profile.dev-static]
inherits = "dev"

[profile.release-static]
inherits = "release"

[lints.clippy]
pedantic = "warn"
as_conversions = "warn"
clone_on_ref_ptr = "warn"
